    <!-- GitHub Pages SPA: decode redirect from 404.html -->
    <script>
      (function() {
        var p = window.location.search.match(/[?&]p=([^&]*)/);
        if (p) {
          window.history.replaceState(null, null,
            window.location.pathname + decodeURIComponent(p[1]).replace(/&/, '?') +
            window.location.hash
          );
        }
      })();
    </script>
