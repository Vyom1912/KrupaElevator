<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>KRUPA ELEVATORS | Reliable Riding Experience</title>
    <script>
      // Single Page Apps for GitHub Pages redirect script
      // Redirects non-hash URLs back into the HashRouter
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
        '/#' + (path ? '/' + path : '') +
        (l.search ? '?' + l.search.slice(1) : '') +
        l.hash;
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body>
    <p style="font-family: sans-serif; text-align: center; margin-top: 50px; color: #0799a4;">
      Loading KRUPA ELEVATORS...
    </p>
  </body>
</html>
